[project]
name = "nginx2root-lab"
version = "0.1.0"
description = "Isolated-lab reproductions and evidence for the nginx2root vulnerabilities"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "pydantic>=2.0",
  "rich>=13.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["suite/tests", "tests"]
pythonpath = ["."]
